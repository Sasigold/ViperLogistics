name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: lint · typecheck · build · unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build

  database:
    name: migrations · RLS · pricing · attendance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The suite brings up its own cluster under /var/tmp and applies every
      # migration in order before asserting, so all it needs is the binaries.
      # Postgres 17 matches production; run.sh picks the newest it finds.
      - name: install postgres
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-17

      # run.sh drops privileges to the postgres user, which has to be able to
      # reach the directory it initdb's into.
      - name: run the SQL suite
        run: sudo -E ./supabase/tests/run.sh
