    <!-- מותקן כאפליקציה: זום בצביטה או בדאבל-טאפ הוא מחווה של אתר, לא של אפליקציה.
         בלי viewport-fit=cover: ה-webview כבר נעצר מעל האזורים הבטוחים, ולכן
         env(safe-area-inset-*) חייב להישאר 0 — אחרת הריפוד שנשען עליו נספר
         פעמיים, והמסך כולו נדחף למעלה מעל התפריט התחתון. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#05070c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

      href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap"

    />
    <!-- מסך הפתיחה: הלוגו משורטט מחדש כווקטור, כדי שכל חלק בו יזוז לבד.
         הכול כאן, inline ובלי JS, כי זה מה שנראה עוד לפני שהבאנדל ירד —
         ובאפליקציה מותקנת זה ממשיך בלי תפר את מסך הפתיחה של המערכת, שצבעו
         background_color מה-manifest (#05070c). מי שמסלק אותו: src/app/splash.ts. -->
    <style>
      #vl-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding-bottom: 6vh;
        background:
          radial-gradient(60% 45% at 50% 52%, rgb(26 102 242 / 0.1), transparent 70%),
          radial-gradient(120% 70% at 12% 0%, #0d1a33, #05070c 62%);
        transition: opacity 0.45s ease;
        animation: vl-sp-failsafe 0.4s ease 12s forwards;
      }
      #vl-splash.vl-splash--out {
        opacity: 0;
        pointer-events: none;
      }
      .vl-sp-logo {
        width: min(80vw, 440px);
        height: auto;
        aspect-ratio: 470 / 400;
        overflow: visible;
        transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .vl-splash--out .vl-sp-logo {
        transform: scale(1.08);
      }
      .vl-sp-logo path,
      .vl-sp-logo circle {
        transform-box: fill-box;
      }

      /* 1. הכביש נסלל מהצופה אל האופק */
      .vl-sp-draw {
        stroke-dasharray: 1 1;
        animation: vl-sp-draw 0.7s cubic-bezier(0.25, 0.75, 0.3, 1) 0.05s both;
      }
      #vl-sp-m-blue .vl-sp-draw {
        animation-delay: 0.18s;
      }
      /* 2. האותיות נכנסות בתנופה של הנטייה שלהן */
      .vl-sp-word path {
        animation: vl-sp-slide 0.5s cubic-bezier(0.16, 1, 0.3, 1) calc(0.34s + var(--i) * 0.06s) both;
      }
      /* 3. הנקודה נוחתת על ה-i, ומשם הגל */
      .vl-sp-ball {
        transform-origin: 50% 100%;
        animation: vl-sp-drop 0.65s linear 0.66s both;
      }
      .vl-sp-ring {
        transform-origin: center;
        opacity: 0;
        animation: vl-sp-ring 1.8s cubic-bezier(0.2, 0.6, 0.35, 1) 0.97s infinite;
      }
      /* 4. LOGISTICS מתכנס מריווח רחב */
      .vl-sp-sub path {
        animation: vl-sp-track 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.78s both;
      }
      /* 5. כל עוד האפליקציה עולה: אור שנוסע על הכביש אל האופק */
      .vl-sp-streak {
        stroke-dasharray: 0.1 1.4;
        stroke-dashoffset: 0.1;
        opacity: 0.4;
        animation: vl-sp-streak 1.6s cubic-bezier(0.3, 0.2, 0.4, 1) 1.2s infinite backwards;
      }

      @keyframes vl-sp-draw {
        from {
          stroke-dashoffset: 1;
        }
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes vl-sp-slide {
        from {
          opacity: 0;
          transform: translateX(-48px);
        }
        35% {
          opacity: 1;
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes vl-sp-drop {
        from {
          opacity: 0;
          transform: translateY(-110px) scale(0.85, 1.15);
          animation-timing-function: cubic-bezier(0.55, 0, 1, 0.45);
        }
        12% {
          opacity: 1;
        }
        48% {
          transform: translateY(0) scale(0.92, 1.1);
          animation-timing-function: ease-out;
        }
        60% {
          transform: translateY(0) scale(1.28, 0.72);
          animation-timing-function: cubic-bezier(0.3, 0, 0.5, 1);
        }
        76% {
          transform: translateY(-16px) scale(0.94, 1.06);
          animation-timing-function: cubic-bezier(0.5, 0, 0.7, 1);
        }
        90% {
          transform: translateY(0) scale(1.08, 0.93);
          animation-timing-function: ease-out;
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes vl-sp-ring {
        from {
          opacity: 0.85;
          transform: scale(1);
        }
        to {
          opacity: 0;
          transform: scale(3.1);
        }
      }
      @keyframes vl-sp-track {
        from {
          opacity: 0;
          transform: translateX(calc(var(--i) * 9px));
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes vl-sp-streak {
        from {
          stroke-dashoffset: 0.1;
        }
        to {
          stroke-dashoffset: -1;
        }
      }
      @keyframes vl-sp-failsafe {
        to {
          opacity: 0;
          visibility: hidden;
          pointer-events: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #vl-splash *,
        #vl-splash.vl-splash--out .vl-sp-logo {
          animation: none !important;
          transition: none !important;
          transform: none !important;
        }
        .vl-sp-streak {
          display: none;
        }
      }
    </style>
    <title>ViperLogistics — ניהול כוח אדם</title>
